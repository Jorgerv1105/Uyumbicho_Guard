spring.application.name=uyumbichoguard

# --- Datasource (temporal) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/uyumbichoguard
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true


server.port=8080

# --- Proveedor de datos vehiculares (Adapter pattern) ---
# Valores: mock (desarrollo/tesis) | sri (producción)
# Sin este perfil activo explícitamente, MockVehiculoProvider se activa
# igual por el profile "default".
app.vehiculo-provider.tipo=mock

# --- Config del proveedor SRI real (solo se usa si el profile "sri" está activo) ---
app.vehiculo-provider.sri.base-url=https://api.sri.gob.ec/v1
app.vehiculo-provider.sri.api-key=PENDIENTE_CREDENCIALES_OFICIALES_SRI
app.vehiculo-provider.sri.timeout-conexion-ms=5000
app.vehiculo-provider.sri.timeout-lectura-ms=8000


# --- JWT (temporal, se reorganiza en application.yml en Parte 7) ---
# Secreto de ejemplo SOLO para desarrollo local - genera uno real con:
# openssl rand -base64 32
app.jwt.secret=Y2FtYmlhLWVzdGUtc2VjcmV0by1lbi1wcm9kdWNjaW9uLXV5dW1iaWNob2d1YXJk
app.jwt.expiration-ms=900000
app.jwt.refresh-expiration-ms=604800000

# --- WhatsApp (Meta Cloud API) ---
# false mientras no tengas cuenta Meta Business verificada: todo queda
# registrado como OMITIDO sin llamar a Meta realmente.
app.whatsapp.enabled=false
app.whatsapp.base-url=https://graph.facebook.com
app.whatsapp.api-version=v20.0
app.whatsapp.phone-number-id=PENDIENTE_CONFIGURAR
app.whatsapp.access-token=PENDIENTE_CONFIGURAR
app.whatsapp.plantilla-alerta-seguridad=alerta_seguridad_uyumbichoguard
app.whatsapp.plantilla-movimiento-vehiculo=notificacion_movimiento_vehiculo
app.whatsapp.idioma-plantilla=es