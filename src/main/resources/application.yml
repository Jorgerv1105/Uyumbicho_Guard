spring:
  application:
    name: uyumbichoguard

  # Perfil activo por defecto: dev (local, sin Docker). El perfil
  # "docker" se activa en producción vía variable de entorno
  # SPRING_PROFILES_ACTIVE=docker (ver Parte 13).
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/uyumbichoguard}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      # Pool pequeño a propósito: un solo pueblo, tráfico bajo/medio.
      # Ajustable sin recompilar si el uso crece.
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      # validate (no update/create): el esquema SOLO lo gestiona
      # Flyway. Si Hibernate y las migraciones no coinciden, el
      # arranque falla ruidosamente en vez de corromper el esquema
      # silenciosamente — preferible en un sistema de seguridad real.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        # Solo "health" expuesto — nunca exponer /actuator/env o
        # /actuator/beans en un sistema con datos de seguridad
        # comunitaria, revelarían configuración interna.
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.udla.uyumbichoguard: DEBUG
    org.hibernate.SQL: WARN

# ===================== Configuración propia de la app =====================

app:
  jwt:
    secret: ${JWT_SECRET:Y2FtYmlhLWVzdGUtc2VjcmV0by1lbi1wcm9kdWNjaW9uLXV5dW1iaWNob2d1YXJk}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}         # 15 minutos
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}  # 7 días

  cors:
    # Lista separada por comas. En dev, el puerto por defecto de Vite.
    # En producción (Parte 13) se sobreescribe con el dominio real.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  vehiculo-provider:
    # mock (activo) | sri (documentado, no conectado — ver Parte 4)
    tipo: ${VEHICULO_PROVIDER_TIPO:mock}
    sri:
      base-url: ${SRI_BASE_URL:https://api.sri.gob.ec/v1}
      api-key: ${SRI_API_KEY:PENDIENTE_CREDENCIALES_OFICIALES_SRI}
      timeout-conexion-ms: 5000
      timeout-lectura-ms: 8000

  whatsapp:
    enabled: ${WHATSAPP_ENABLED:false}
    base-url: https://graph.facebook.com
    api-version: v20.0
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:PENDIENTE_CONFIGURAR}
    access-token: ${WHATSAPP_ACCESS_TOKEN:PENDIENTE_CONFIGURAR}
    plantilla-alerta-seguridad: alerta_seguridad_uyumbichoguard
    plantilla-movimiento-vehiculo: notificacion_movimiento_vehiculo
    idioma-plantilla: es

  # Credenciales del ADMIN inicial, usadas SOLO por DataInitializer si
  # la tabla usuarios está vacía. Cámbialas antes de desplegar en real.
  admin-inicial:
    cedula: ${ADMIN_CEDULA:1700000001}
    nombres: ${ADMIN_NOMBRES:Administrador}
    apellidos: ${ADMIN_APELLIDOS:Sistema}
    email: ${ADMIN_EMAIL:admin@uyumbichoguard.ec}
    password: ${ADMIN_PASSWORD:Uyumbicho2026*}

---
# Perfil "docker": overrides aplicados cuando corre en contenedor
# (Parte 13). Aquí solo se documenta la intención; los valores reales
# vienen del .env vía las variables de entorno de arriba.
spring:
  config:
    activate:
      on-profile: docker
logging:
  level:
    root: WARN
    com.udla.uyumbichoguard: INFO